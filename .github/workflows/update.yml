name: Update IPTV Playlists

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download IPTV data
        run: |
          mkdir -p countries
          curl -L https://iptv-org.github.io/iptv/countries/tr.m3u -o countries/tr.m3u
          curl -L https://iptv-org.github.io/iptv/countries/de.m3u -o countries/de.m3u
          curl -L https://iptv-org.github.io/iptv/countries/gb.m3u -o countries/gb.m3u
          curl -L https://iptv-org.github.io/iptv/countries/us.m3u -o countries/us.m3u

      - name: Commit playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add countries/

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update IPTV playlists"
            git push
          fi
